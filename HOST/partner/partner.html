<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Profile</title>
    <link rel="stylesheet" href="css/page.css">
</head>

<body>
    <!-- Header widget -->
    <header 
        data-header-widget 
        data-page-name="Partner Profile" 
        data-requireToken="true"
    >
    </header>
    <script src="https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/header-widget.js"></script>

    <!-- Main content -->
     <main style="max-width: 1100px; margin: 40px auto; padding: 0 20px; margin-top: 80px;">        
       
        <!-- Partner Gallery Widget Container -->
        <div id="partner-gallery-widget"></div>

    </main>
    <br>

    <!-- Load the Partner Gallery Widget -->
    <script src="https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/partner-gallery.js"></script>

    <!-- Footer -->
    <footer id="footer"></footer>

    <script>
        // Load footer
        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load footer.html');
                return response.text();
            })
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading footer:', error.message);
                document.getElementById('footer').innerHTML = '<p>Footer content unavailable</p>';
            });
    </script>

</body>
</html>
